<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>捕获动画样式分镜 · PokeTrail</title>
<style>
  :root {
    --cyan: #00FFFF; --yellow: #FFFF00; --gold: #FFD500;
    --white: #FFFFFF; --grey: #7B7B7B; --sel: #182831;
  }
  * { margin: 0; box-sizing: border-box; }
  body { background: #101418; color: var(--white); font-family: "PingFang SC", sans-serif; padding: 32px 16px; }
  h1 { font-size: 20px; text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; color: var(--grey); font-size: 12px; margin-bottom: 28px; }
  .grid { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; max-width: 1560px; margin: 0 auto; }
  figure { width: 480px; }
  .screen { width: 466px; height: 466px; border-radius: 50%; background: #000;
            position: relative; overflow: hidden; outline: 1px solid #2a3138; }
  .abs { position: absolute; transform: translate(-50%, -50%); text-align: center; }
  .t16 { font-size: 16px; } .t24 { font-size: 24px; font-weight: 600; }
  .cyan { color: var(--cyan); } .yellow { color: var(--yellow); }
  .gold { color: var(--gold); } .grey { color: var(--grey); }
  .px { image-rendering: pixelated; }
  .ring { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
  figcaption { margin-top: 10px; font-size: 13px; color: #c9d2d9; line-height: 1.5; }
  figcaption b { color: var(--cyan); font-weight: 600; }
  .btn { background: var(--sel); color: var(--cyan); border-radius: 8px;
         width: 300px; height: 44px; line-height: 44px; font-size: 16px; }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .halo { animation: spin 8s linear infinite; }
  .blink { animation: pulse 1s ease-in-out infinite; }
</style>
</head>
<body>
<h1>捕获动画样式分镜</h1>
<p class="sub">466×466 圆屏 1:1 · 皮卡丘 58 帧原始时长 · 精灵球 30×30 提取自固件 · 中心 (233,233)</p>

<div class="grid">

<figure>
  <div class="screen">
    <div class="abs" style="left:216px;top:43px;"><img class="px" src="../../assets/sprites/icons/poke-ball.png" width="30" height="30"></div>
    <div class="abs t16" style="left:246px;top:43px;">5</div>
    <div class="abs t16 cyan" style="left:233px;top:80px;">皮卡丘</div>
    <div class="ring" style="left:233px;top:233px;width:160px;height:160px;border:2px solid var(--cyan);"></div>
    <div class="ring" style="left:233px;top:233px;width:48px;height:48px;border:2px solid var(--yellow);"></div>
    <img class="abs px" src="../../assets/sprites/black-white/0025.gif" width="100" height="92" style="left:233px;top:233px;">
    <div class="ring blink" style="left:233px;top:344px;width:60px;height:60px;border:2px solid var(--gold);"></div>
    <img class="abs px" src="../../assets/sprites/icons/poke-ball.png" width="30" height="30" style="left:233px;top:344px;">
    <div class="abs t16 cyan" style="left:233px;top:391px;">按住蓄力 · 松手投球</div>
    <div class="abs t16 grey" style="left:233px;top:419px;">未投出也会消耗本球</div>
  </div>
  <figcaption><b>蓄力瞄准</b>　球在 (233,344) 保持 30px；金环 r27 半充、r30↔34 充满脉动；收缩圈 &lt;400ms 变黄，Perfect 窗口靶心闪金。</figcaption>
</figure>

<figure>
  <div class="screen">
    <div class="ring" style="left:233px;top:233px;width:48px;height:48px;border:2px solid var(--yellow);"></div>
    <img class="abs px" src="../../assets/sprites/black-white/0025.gif" width="100" height="92" style="left:233px;top:233px;">
    <div class="abs" style="left:250px;top:330px;width:6px;height:6px;background:var(--gold);border-radius:50%;"></div>
    <div class="abs" style="left:260px;top:315px;width:8px;height:8px;background:var(--gold);border-radius:50%;opacity:.7;"></div>
    <div class="abs" style="left:268px;top:300px;width:10px;height:10px;background:var(--gold);border-radius:50%;opacity:.45;"></div>
    <img class="abs px" src="../../assets/sprites/icons/poke-ball.png" width="30" height="30" style="left:270px;top:283px;">
  </div>
  <figcaption><b>投球飞行</b>　450ms ease-out，弧线右鼓 36px；Perfect 金色三点拖尾，Nice 两点白，Normal 无。</figcaption>
</figure>

<figure>
  <div class="screen">
    <img class="abs px" src="../../assets/sprites/black-white/0025.gif" width="100" height="92" style="left:233px;top:233px;filter:brightness(1.8);">
    <div class="ring" style="left:233px;top:233px;width:140px;height:140px;border:4px solid var(--white);"></div>
    <div class="ring" style="left:233px;top:233px;width:60px;height:60px;border:2px solid var(--white);opacity:.5;"></div>
  </div>
  <figcaption><b>吸入白闪</b>　命中瞬间白环 120ms 由 r0 扩到 r90，宝可梦消失，只剩球落向地面。</figcaption>
</figure>

<figure>
  <div class="screen">
    <div class="ring" style="left:233px;top:330px;width:180px;height:14px;border-bottom:2px solid var(--grey);border-top:none;opacity:.4;"></div>
    <img class="abs px" src="../../assets/sprites/icons/poke-ball.png" width="30" height="30" style="left:233px;top:300px;transform:translate(-50%,-50%) rotate(-20deg);opacity:.25;">
    <img class="abs px" src="../../assets/sprites/icons/poke-ball.png" width="30" height="30" style="left:233px;top:300px;transform:translate(-50%,-50%) rotate(20deg);opacity:.25;">
    <img class="abs px" src="../../assets/sprites/icons/poke-ball.png" width="30" height="30" style="left:233px;top:300px;transform:translate(-50%,-50%) rotate(-20deg);">
    <div class="abs gold" style="left:272px;top:288px;font-size:18px;">✦</div>
  </div>
  <figcaption><b>落地摇摆</b>　球落 y=300 弹两下，±20° 摇摆 3×500ms，每次配 15ms 振动与侧星；失败在第 1+roll%3 次中点爆开。</figcaption>
</figure>

<figure>
  <div class="screen">
    <div class="ring blink" style="left:233px;top:300px;width:88px;height:88px;border:2px solid var(--gold);"></div>
    <img class="abs px" src="../../assets/sprites/icons/poke-ball.png" width="30" height="30" style="left:233px;top:300px;">
    <div class="abs" style="left:233px;top:185px;color:var(--white);font-size:22px;">✦</div>
    <div class="abs" style="left:150px;top:225px;color:var(--gold);font-size:16px;">✦</div>
    <div class="abs" style="left:316px;top:225px;color:var(--gold);font-size:16px;">✦</div>
    <div class="abs" style="left:170px;top:150px;color:var(--gold);font-size:13px;">✦</div>
    <div class="abs" style="left:296px;top:150px;color:var(--white);font-size:13px;">✦</div>
    <div class="abs" style="left:233px;top:120px;color:var(--gold);font-size:15px;">✦</div>
  </div>
  <figcaption><b>捕获成功</b>　6 颗十字星 600ms 自 r20 扩散到 r110，白金交替，金环收球，振动 3×30ms；任意键快进。</figcaption>
</figure>

<figure>
  <div class="screen">
    <div class="ring" style="left:233px;top:233px;width:170px;height:170px;border:4px solid var(--white);opacity:.85;"></div>
    <img class="abs px" src="../../assets/sprites/black-white/0025.gif" width="100" height="92" style="left:233px;top:233px;">
    <img class="abs px" src="../../assets/sprites/icons/poke-ball.png" width="30" height="30" style="left:233px;top:330px;opacity:.4;">
  </div>
  <figcaption><b>挣脱</b>　白闪后宝可梦跳回原位，球淡落底部；有剩余回投球菜单，用完进逃脱结果页。</figcaption>
</figure>

<figure>
  <div class="screen">
    <div class="abs t24" style="left:233px;top:52px;">捕捉成功</div>
    <div class="abs t16 cyan" style="left:233px;top:90px;">皮卡丘</div>
    <div class="ring halo" style="left:233px;top:172px;width:124px;height:124px;border:2px dashed var(--gold);"></div>
    <img class="abs px" src="../../assets/sprites/black-white/0025.gif" width="100" height="92" style="left:233px;top:172px;">
    <div class="abs t16 gold" style="left:233px;top:238px;">✦ 首次捕获 ✦</div>
    <div class="abs t16 grey" style="left:233px;top:262px;">2026-10-23 21:48</div>
    <div class="abs t16 cyan" style="left:233px;top:290px;">森林</div>
    <div class="abs btn" style="left:233px;top:372px;">确认结果 · 继续探索</div>
  </div>
  <figcaption><b>结果页 · 首捕</b>　中央 2 倍动画 sprite + 金色光环 8s/圈 +「首次捕获」标记，复用首页变帧重绘；非首捕无光环无标记。</figcaption>
</figure>

</div>

</body>
</html>
