; M5Stack StopWatch (C152) 宝可梦步行探险。
; 固定平台与库版本，保证固件和主机驱动回归使用相同依赖。

[platformio]
default_envs = 20_pokedex
src_dir = firmware

[c152]
platform = espressif32 @ 6.10.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_speed = 460800
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Ifirmware/shared
lib_deps =
    m5stack/M5Unified@0.2.19
    m5stack/M5GFX@0.2.27
    m5stack/M5PM1@1.0.6
    m5stack/M5IOE1@1.0.8

[env:20_pokedex]
extends = c152
build_src_filter = -<*> +<shared/> +<apps/20_pokedex/>
